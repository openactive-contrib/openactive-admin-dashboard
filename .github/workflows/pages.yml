name: Docs

# The runbooks are published from docs/ to GitHub Pages. Requires
# Settings -> Pages -> Source = "GitHub Actions" to be selected once, by hand.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one midway: a cancelled deploy can
# leave the site on a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Injects the site's url and baseurl into the Jekyll config, so docs/_config.yml
      # does not have to hard-code the Pages hostname.
      - uses: actions/configure-pages@v6

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
