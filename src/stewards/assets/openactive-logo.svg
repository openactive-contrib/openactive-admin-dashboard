     official OpenActive logo — drop the real SVG in at this path to replace it.
     The teal must stay in step with theme.TEAL (tests/unit/test_assets.py). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 28" role="img"
     aria-label="OpenActive">
  <rect x="0" y="2" width="24" height="24" rx="6.5" fill="#0E8F8A"/>
  <text x="12" y="19.5" text-anchor="middle" fill="#FFFFFF"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="11.5" font-weight="700" letter-spacing="-0.3">OA</text>
  <text x="32" y="19.5" fill="#FFFFFF" textLength="86" lengthAdjust="spacingAndGlyphs"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="14.5" font-weight="600" letter-spacing="-0.2">OpenActive</text>
</svg>
