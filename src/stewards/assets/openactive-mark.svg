<?xml version="1.0" encoding="UTF-8"?>
<!-- Square mark. Streamlit shows this in the app's top-left while the sidebar is
     collapsed, where the ground is the light canvas rather than the dark sidebar — so the
     teal field is part of the artwork and the mark reads on either. PLACEHOLDER: see
     openactive-logo.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img"
     aria-label="OpenActive">
  <rect x="0" y="0" width="24" height="24" rx="6.5" fill="#0E8F8A"/>
  <text x="12" y="17.5" text-anchor="middle" fill="#FFFFFF"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="11.5" font-weight="700" letter-spacing="-0.3">OA</text>
</svg>
