[project]
name = "stewards"
version = "0.1.0"
description = "OpenActive Data Stewards Dashboard — internal data health monitoring for the ODI tech team"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit[auth]>=1.40",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stewards"]

[tool.ruff]
line-length = 96
target-version = "py312"
src = ["src", "tests"]
# Ruff formats fenced code in markdown; the brief and the skills are specs, not code.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ANN", "PT"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"src/stewards/views/*" = ["INP001"]
"tests/*" = ["ANN001", "ANN201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/stewards"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/stewards"]
omit = ["src/stewards/views/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
